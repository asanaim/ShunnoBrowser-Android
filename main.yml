name: Build Shunno Browser Ultra-Lite APK

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build R8-Shrunk Ultra-Lite APK
        run: gradle assembleRelease --no-daemon

      - name: Prepare Release APK
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/release/app-release.apk release-apk/ShunnoBrowser.apk

      - name: Upload ShunnoBrowser APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShunnoBrowser-UltraLite-APK
          path: release-apk/ShunnoBrowser.apk

      - name: Publish 1-Click Direct Download Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Shunno Browser v1.0 (~700 KB Ultra-Lite NBPro + Brave Audio + Shunno Get)"
          make_latest: true
          body: |
            ### Direct 1-Click Download for Android (~700 KB)
            Ultra-lightweight Naked Browser Pro alternative with Brave-style background YouTube playback, network AdBlock, SponsorBlock, PiP, and integrated multi-threaded Shunno Get downloads:
            - **[Download ShunnoBrowser.apk](https://github.com/${{ github.repository }}/releases/latest/download/ShunnoBrowser.apk)**
          files: |
            release-apk/ShunnoBrowser.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
