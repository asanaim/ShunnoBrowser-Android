name: Build Shunno Browser Android APK

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 26.3.11579264
        run: sdkmanager "ndk;26.3.11579264"

      - name: Install Rust & Android Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Run Rust Core Unit Tests
        working-directory: rust-core
        run: cargo test --test core_tests

      - name: Cross-Compile libshunno_core.so (arm64-v8a)
        working-directory: rust-core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build Android APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare Release APK
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/ShunnoBrowser.apk

      - name: Upload ShunnoBrowser APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShunnoBrowser-Android-APK
          path: release-apk/ShunnoBrowser.apk

      - name: Publish 1-Click Direct Download Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Shunno Browser v2.24.0 Android APK"
          make_latest: true
          files: release-apk/ShunnoBrowser.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
